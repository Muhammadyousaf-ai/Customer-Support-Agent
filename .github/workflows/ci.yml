name: CI

# Manual only for now (Actions tab -> CI -> Run workflow). Deploys run from deploy.yml without waiting on this.
on:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: support
          POSTGRES_PASSWORD: support
          POSTGRES_DB: support_ai
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U support -d support_ai" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://support:support@localhost:5433/support_ai
      # Routine CI never calls OpenAI: tests use scripted providers. No secrets are needed or exposed here.
      OPENAI_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @support-ai/contracts build
      - run: pnpm lint
      - run: pnpm check-types
      - run: pnpm --filter api db:migrate
      - run: pnpm test
      - run: pnpm build
      - name: Audit production dependencies (fail on high/critical)
        run: pnpm audit --prod --audit-level high

  image:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the backend image
        run: docker build -t support-ai-api .

  # Browser tests need Chrome and the docker-exec helpers used by the specs; run on demand.
  e2e:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: "24", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: docker compose up -d db
      - run: pnpm --filter @support-ai/contracts build && pnpm --filter api db:migrate && pnpm --filter api rag:ingest
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - run: pnpm --filter web exec playwright test -c playwright.voice.config.ts
        env: { PW_CHANNEL: "" }
